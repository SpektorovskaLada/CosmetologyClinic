{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інформація про лікаря</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/doctor_info.css' %}">
    <!-- <link rel="stylesheet" href="./../stylecss/main_menu.css"> -->
</head>
<body>
    <header>
        <nav>
            <div class="emblema">
                <a href="{% url 'home' %}">
                    <img src="{% static 'images/emblema.png' %}" alt="Кнопка виходу на головну сторінку">
                </a>
            </div>
            <div class="links">
            <div class="links-inner a"><a class="links-a" href="{% url 'home' %}#services">Послуги</a></div>
            <div class="links-inner a"><a class="links-a" href="{% url 'shop' %}">Магазин</a></div>
            <div class="links-inner a"><a class="links-a" href="{% url 'home' %}#reviews">Відгуки</a></div>
            <div class="links-inner"><button id="openFormBtn" class="contact_button">Зв'язатись</button></div>
            <a href="/admin-panel/" class="admin-mini-btn">⚙ </a>
            </div>
        </nav>
    </header>
    

    <!-- ФОРМА ЗАПИСУ -->


    <div id="formWraper" class="form-wraper">
        <div class="form-container">
            <div class="cls-btn-wrp"><button class="cls-btn" id="closeZapisForm">×</button></div>
            <form method="dialog" class="dialog-form" id="zapisForm">
                <h2 class="zapis-hat">Записатися на прийом</h2>
                <div class="form-insides">
                    <label for="name">Ваше ім'я:</label>
                    <input class="form-inputs" type="text" id="zapisName" name="name" placeholder="Введіть ваше ім'я">
                </div>

                <div class="form-insides">
                    <label for="phone">Ваш телефон:</label>
                    <input class="form-inputs" type="tel" id="zapisPhone" name="phone" placeholder="+380 (XX) XXX-XXXX" pattern="\+?[0-9\s\-\(\)]{10,15}">
                </div>

                <div class="form-insides big-input">
                    <label for="message">Коментар:</label>
                    <textarea class="form-inputs" id="zapisMessage" name="message" placeholder="Ваші побажання або питання"></textarea>
                </div>
                <div class="form-insides">
                    <label>
                        <input type="checkbox" id="zapisAgree" name="agree">
                        Погоджуюсь на обробку даних
                    </label>
                </div>
                <button class="submit-btn" id="submitZapisBtn" type="submit">Записатися</button>
            </form>
        </div>
    </div>
    
    <!-- ФОРМА ЗАПИСУ -->

        <article class="face_article">
            <div class="face_container">

                <div class="face-wraper">
                    <img class="face_inside_image" src="{% static doctor.photo %}" alt="Доктор">
                </div>

                <h6 class="face_inside">
                    {{ doctor.description }}
                </h6>

            </div>
        </article>

        <div class="diplomas_container_centrifier">
            <div class="diplomas-gridy-container">

                {% for diploma in diplomas %}
                    <div class="image-container">
                        <img src="{% static diploma %}" alt="preview" class="thumbnail" onclick="showFullImage(this)">
                    </div>
                {% endfor %}

            </div>
        </div>


    <div id="full-image-modal" class="modal" onclick="closeModal()">
        <img id="full-image" src="" alt="diploma">
    </div>

    <footer id="=contacts">
        <div class="social_media">
            <div><img class="emblema-footer" src="{% static 'images/emblema.png' %}" alt="Емблема клініки"></div>
            <div class="social_media_links">
                <div><a href="https://www.tiktok.com/@dr.ovcharenko?_t=8qtqBxTkLOX&_r=1"><img src="{% static 'images/tiktok.png' %}" alt="tik tok" width="40"></a></div>
                <div><a href="https://www.instagram.com/cosmetology_dr.ovcharenko/"><img src="{% static 'images/instagram.png' %}" alt="instagram" width="40"></a></div>
            </div>
        </div>
        
        <div class="phone">
            <h2>Зв'яжіться з нами</h2>
            <p class="unclapped_margin"><b>Phone</b></p>
            <a href="tel:+1234567890"><b>+123-456-78-90</b></a>
            <p class="unclapped_margin"><b>Email</b></p>
            <a href="mailto:examplemail@email.org"><b>name@email.com</b></a>
        </div>
        <div class="location">
            <h2>Address</h2>
            <a class="unclapped_margin" href="https://maps.app.goo.gl/KUZNQT1GrH1TAQYc9"><b>Київ, вул.Жилянська 31</b></a>
            <div>
                <span><img src="{% static 'images/metro.png' %}" alt="Емблема метрополітена" width="15"></span>
                <b>Олімпійська</b>
            </div>
        </div>
    </footer>
    <script src="{% static 'js/doctor_info.js' %}"></script>
    <script src="{% static 'js/zapis.js' %}"></script>
</body>
</html>
